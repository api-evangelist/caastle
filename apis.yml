aid: caastle
name: CaaStle
description: >-
  CaaStle Inc. was a New York based business-to-business "Clothing-as-a-Service"
  company that built white-label clothing rental, subscription and resale
  infrastructure for apparel retailers, operating tenant-branded storefronts and
  reverse-logistics for partner brands rather than selling directly to consumers.
  The company collapsed in 2025: its board confirmed financial distress and
  furloughed staff in April 2025, and it filed for Chapter 7 bankruptcy in the
  District of Delaware on 20 June 2025 (case 25-11187), electing liquidation over
  reorganization. Founder and chief executive Christine Hunsicker resigned amid
  allegations of fabricated financial disclosures and later pleaded guilty to a
  fraud scheme prosecutors valued in the hundreds of millions of dollars. CaaStle
  never operated a public developer program, and the caastle.com domain has since
  passed out of the company's control.
